[project]
# NOTE: workspace dist-name is `pbg-biomodels` (not just `biomodels`) to
# avoid shadowing the PyPI `biomodels` package — the BioModels REST API
# client that pbg-biomodels-bundle depends on. The workspace's display
# name in workspace.yaml stays "biomodels".
name = "viva-biomodels"
version = "0.0.0"
description = "Process-bigraph research workspace"
requires-python = ">=3.12"
dependencies = [
    # >=1.7.0 to match vivarium-workbench@main (which requires process-bigraph>=1.7.0);
    # an exact ==1.5.0 pin made the graph unsatisfiable once workbench moved to 1.7.
    # 1.7+ still provides `process_bigraph.composite_spec` (used by viva-superpowers).
    "process-bigraph>=1.7.0",
    "bigraph-schema",
    # Required by pbg-superpowers' readout_resolver / readout_validation /
    # study_evaluator subpackages (undeclared optional import upstream); without
    # it those generators are silently skipped during dashboard runs.
    "polars",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    # Reads BioSimulators SED-ML reference results (reports.h5) for the
    # batch-compare composite's optional `reference_results_dir` input.
    "h5py",
    # Reads/writes the committed corpus_comparison parquet dataset via the
    # pbg_biomodels.corpus_results reader (pandas needs a parquet engine).
    "pyarrow",
    # Web-based workspace dashboard (server + templates + assets + lib helpers).
    # Extracted from pbg-template as of v0.5.0; provides the `vivarium-workbench
    # serve` CLI invoked by scripts/serve.sh (import package: vivarium_workbench).
    "vivarium-workbench",
    # Simulator wrappers (absorbed from pbg-biomodels-bundle).
    "viva-tellurium",
    "viva-copasi",
    "viva-simbio",
    # BioModels corpus + SED-ML/SBML parsing (absorbed from pbg-biomodels-bundle).
    "biomodels",
    "rest-process",
    "python-libsedml",
    "python-libsbml",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
batch = ["pbest"]  # used by run_biomodels CLI / batch tooling
# AMICI as a 4th comparison engine. Optional because amici has no binary wheel
# (it builds from source + compiles a C++ extension per model), so it must not
# burden the base install / CI. Install with `pip install -e ".[amici]"` to
# add it to the default simulator set.
amici = ["viva-amici"]
# PySCeS as a comparison engine. Optional like amici: PySCeS reads its own PSC
# format (SBML is converted via libSBML on first use), and it adds the heavier
# pysces dependency. Install with `pip install -e ".[pysces]"` to add it to the
# default simulator set.
pysces = ["viva-pysces"]
# Scale-out: Ray fan-out runner (ray_runner) + two-tier parquet storage
# (two_tier / lazy_viewer) for running the full BioModels set. Install with
# `pip install -e ".[scale]"`.
scale = ["ray", "pyarrow"]

[project.scripts]
viva-biomodels = "viva_biomodels.cli:main"
pbg-biomodels = "viva_biomodels.cli:main"   # back-compat alias (deprecated)

[tool.uv.sources]
# Canonical git source for pbg-basic-processes (not on PyPI). pbg-superpowers and
# vivarium-workbench each require it transitively but pin it in DIFFERENT forms —
# vivarium-workbench via a bare dep + its own [tool.uv.sources] (branch="main"),
# viva-simbio via a PEP 508 direct reference (... @ git+...@main). uv treats those
# forms as conflicting URLs and refuses to resolve. Declaring the source here, in
# the root project, is authoritative: uv unifies every pbg-basic-processes
# requirement across the graph to this single spec. Keep it matching the upstream
# branch="main" form.
pbg-basic-processes = { git = "https://github.com/vivarium-collective/pbg-basic-processes.git", branch = "main" }
# These sibling process-packages are not on PyPI. Declare them as GIT sources
# (like pbg-basic-processes above), NOT local `path = ../…` sources: uv honors a
# git-installed package's [tool.uv.sources], so a local path here leaks into every
# consumer that installs viva-biomodels from git (e.g. viva-human-atlas' publish
# CI), where the sibling dir doesn't exist and the whole install aborts.
# Git sources resolve everywhere. For LOCAL editable dev of a sibling, override it
# per-checkout (e.g. `uv pip install -e ../vivarium-workbench` after sync, or a
# personal uv workspace) rather than pinning the path in the published pyproject.
# NOTE: source keys must match each package's DIST name — copasi/tellurium/the
# workbench were renamed to viva-*; simbio/amici/pysces keep their pbg-* dist name
# even though their repos/dirs are now viva-*.
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
viva-tellurium = { git = "https://github.com/vivarium-collective/viva-tellurium.git", branch = "main" }
viva-copasi = { git = "https://github.com/vivarium-collective/viva-copasi.git", branch = "main" }
viva-simbio = { git = "https://github.com/vivarium-collective/viva-simbio.git", branch = "main" }
viva-amici = { git = "https://github.com/vivarium-collective/viva-amici.git", branch = "main" }
viva-pysces = { git = "https://github.com/vivarium-collective/viva-pysces.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This is a research workspace, not a distributable Python package.
# bypass-selection skips hatchling's package-discovery step so `pip install -e .`
# only installs the dependencies above and doesn't try to package the workspace's
# top-level dirs (datasets/, docs/, models/, …) as Python modules.
[tool.hatch.build.targets.wheel]
bypass-selection = true
